<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ikavelth's Journal</title>
<meta name="description" content="Ikavelth's Journal. Three recorded entries against the silent hour." />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap');

  :root{
    --bg-primary:#0a0608; --bg-secondary:#110d10; --bg-card:#1a1320;
    --text-primary:#e8dde8; --text-secondary:#9988a8; --text-muted:#554860;
    --gold:#c9963a; --gold-bright:#e8c87a; --crimson:#8b1a2e; --rose:#d4607a;
    --purple:#6b3d7a; --border:#3d2d45; --border-glow:#6b3d7a;
    --font-heading:'Cinzel','Georgia',serif;
    --font-body:'EB Garamond','Garamond','Georgia',serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{font-size:18px;}
  body{
    background:var(--bg-primary);
    color:var(--text-primary);
    font-family:var(--font-body);
    line-height:1.7;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse 60% 40% at 15% 15%,rgba(139,26,46,0.18) 0%,transparent 70%),
               radial-gradient(ellipse 55% 40% at 85% 82%,rgba(107,61,122,0.22) 0%,transparent 65%),
               radial-gradient(ellipse 80% 60% at 50% 50%,rgba(20,15,24,0.6) 0%,transparent 100%);
  }

  .page-wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:3.25rem 2rem 5rem;}

  /* ── GATE ── */
  .gate{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
  .gate-card{max-width:440px;width:100%;text-align:center;background:var(--bg-secondary);
    border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:3px;
    padding:2.6rem 2rem 2.4rem;box-shadow:0 18px 44px -28px rgba(0,0,0,0.85);}
  .gate-q{font-family:var(--font-heading);font-weight:600;font-size:clamp(1.3rem,4vw,1.75rem);
    color:var(--text-primary);line-height:1.3;margin-top:1rem;text-wrap:balance;}
  #gate-form{margin-top:1.7rem;display:flex;flex-direction:column;gap:.9rem;}
  #answer{font-family:var(--font-body);font-size:1.1rem;text-align:center;color:var(--text-primary);
    background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:3px;padding:.85rem 1rem;outline:none;
    transition:border-color .2s ease,box-shadow .2s ease;}
  #answer:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,150,58,0.15);}
  #answer::placeholder{color:var(--text-muted);font-style:italic;}
  #gate-btn{font-family:var(--font-heading);font-weight:600;letter-spacing:.09em;color:var(--bg-primary);
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));border:none;border-radius:3px;
    padding:.9rem;cursor:pointer;text-transform:uppercase;font-size:.78rem;transition:opacity .2s ease;}
  #gate-btn:disabled{opacity:.55;cursor:default;}
  #gate-btn:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px;}
  .gate-err{min-height:1.2em;color:var(--rose);font-style:italic;font-size:.95rem;}

  /* ── HEADER ── */
  .page-header{text-align:center;border-bottom:1px solid var(--border);padding-bottom:1.9rem;margin-bottom:2.75rem;}
  .page-title{
    font-family:var(--font-heading);
    font-weight:600;
    font-size:clamp(1.7rem,4.5vw,2.5rem);
    line-height:1.25;
    letter-spacing:.02em;
    color:var(--text-primary);
    text-wrap:balance;
  }
  .ornament{display:flex;align-items:center;gap:1rem;color:var(--gold);margin:1.15rem auto 0;max-width:230px;}
  .ornament::before,.ornament::after{content:"";flex:1;height:1px;
    background:linear-gradient(to right,transparent,var(--gold-bright),transparent);}
  .ornament-diamond{font-size:.5rem;color:var(--gold-bright);}

  /* ── ENTRIES ── */
  .entries{display:flex;flex-direction:column;gap:1.75rem;}
  .entry{
    background:var(--bg-secondary);
    border:1px solid var(--border);
    border-left:3px solid var(--gold);
    border-radius:3px;
    padding:1.5rem 1.6rem 1.65rem;
    box-shadow:0 18px 44px -28px rgba(0,0,0,0.85);
  }
  .entry-title{
    font-family:var(--font-heading);
    font-weight:600;
    font-size:1.2rem;
    letter-spacing:.06em;
    color:var(--gold-bright);
  }
  .entry-sub{
    font-family:var(--font-body);
    font-style:italic;
    font-size:1rem;
    color:var(--text-secondary);
    margin-top:.2rem;
  }

  /* ── PLAYER ── */
  .player{
    display:flex;align-items:center;gap:1rem;
    margin-top:1.15rem;
    padding:.8rem .95rem;
    background:rgba(0,0,0,0.28);
    border:1px solid var(--border);
    border-radius:3px;
  }
  .playbtn{
    position:relative;width:46px;height:46px;flex:0 0 auto;
    border-radius:50%;
    border:1px solid var(--gold);
    background:linear-gradient(180deg,#241730 0%,#120c17 100%);
    color:var(--gold-bright);cursor:pointer;
    display:grid;place-items:center;
    transition:box-shadow .25s ease,border-color .25s ease;
  }
  .playbtn:hover{box-shadow:0 0 14px rgba(201,150,58,0.4);border-color:var(--gold-bright);}
  .playbtn:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px;}
  .playbtn svg{width:18px;height:18px;display:block;}
  .playbtn .ico-pause{display:none;}
  .playbtn.playing .ico-play{display:none;}
  .playbtn.playing .ico-pause{display:block;}

  .track{flex:1;display:flex;flex-direction:column;gap:.55rem;min-width:0;}
  .scrub{position:relative;height:5px;background:rgba(201,150,58,0.16);border-radius:3px;cursor:pointer;}
  .scrub .fill{position:absolute;inset:0 auto 0 0;width:0%;
    background:linear-gradient(to right,var(--gold),var(--gold-bright));border-radius:3px;}
  .scrub .head{position:absolute;top:50%;left:0%;width:11px;height:11px;transform:translate(-50%,-50%);
    border-radius:50%;background:var(--gold-bright);box-shadow:0 0 8px rgba(232,200,122,0.6);
    opacity:0;transition:opacity .2s ease;}
  .scrub:hover .head,.player.active .head{opacity:1;}
  .times{display:flex;justify-content:space-between;
    font-family:var(--font-heading);font-size:.62rem;letter-spacing:.1em;
    color:var(--text-muted);font-variant-numeric:tabular-nums;}

  /* ── FOOTER ── */
  .page-footer{margin-top:2.5rem;text-align:center;font-size:.85rem;color:var(--text-muted);font-style:italic;}
  .page-footer .ornament{margin-bottom:1rem;}

  [hidden]{display:none !important;}

  @media (max-width:560px){
    .page-wrap{padding:2.5rem 1.2rem 4rem;}
    .entry{padding:1.25rem 1.15rem 1.35rem;}
    .player{gap:.8rem;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>

<!-- ── GATE ── -->
<section class="gate" id="gate">
  <div class="gate-card">
    <div class="ornament"><span class="ornament-diamond">&#9670;</span></div>
    <h1 class="gate-q">Where are we headed next?</h1>
    <form id="gate-form" autocomplete="off">
      <input id="answer" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="speak it" aria-label="Where are we headed next?" />
      <button type="submit" id="gate-btn">Unseal</button>
      <p class="gate-err" id="gate-err" role="status"></p>
    </form>
  </div>
</section>

<!-- ── JOURNAL (sealed until unlocked) ── -->
<div class="page-wrap" id="journal" hidden>
  <header class="page-header">
    <h1 class="page-title">Ikavelth's Journal</h1>
    <div class="ornament"><span class="ornament-diamond">&#9670;</span></div>
  </header>

  <main class="entries">

    <!-- RECORDING I -->
    <article class="entry">
      <h2 class="entry-title">Recording I</h2>
      <p class="entry-sub">This entry was recorded at the 18th hour.</p>
      <div class="player" id="player-1">
        <button class="playbtn" id="btn-1" aria-label="Play Recording I">
          <svg class="ico-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="ico-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <div class="track">
          <div class="scrub" id="scrub-1" role="slider" aria-label="Seek Recording I" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="fill" id="fill-1"></div>
            <div class="head" id="head-1"></div>
          </div>
          <div class="times"><span id="cur-1">0:00</span><span id="dur-1">0:00</span></div>
        </div>
        <audio id="audio-1" preload="none"></audio>
      </div>
    </article>

    <!-- RECORDING II -->
    <article class="entry">
      <h2 class="entry-title">Recording II</h2>
      <p class="entry-sub">This entry was recorded at the 18th and a quarter hour.</p>
      <div class="player" id="player-2">
        <button class="playbtn" id="btn-2" aria-label="Play Recording II">
          <svg class="ico-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="ico-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <div class="track">
          <div class="scrub" id="scrub-2" role="slider" aria-label="Seek Recording II" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="fill" id="fill-2"></div>
            <div class="head" id="head-2"></div>
          </div>
          <div class="times"><span id="cur-2">0:00</span><span id="dur-2">0:00</span></div>
        </div>
        <audio id="audio-2" preload="none"></audio>
      </div>
    </article>

    <!-- RECORDING III -->
    <article class="entry">
      <h2 class="entry-title">Recording III</h2>
      <p class="entry-sub">This entry was recorded at the 18th and three quarter hour.</p>
      <div class="player" id="player-3">
        <button class="playbtn" id="btn-3" aria-label="Play Recording III">
          <svg class="ico-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="ico-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <div class="track">
          <div class="scrub" id="scrub-3" role="slider" aria-label="Seek Recording III" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="fill" id="fill-3"></div>
            <div class="head" id="head-3"></div>
          </div>
          <div class="times"><span id="cur-3">0:00</span><span id="dur-3">0:00</span></div>
        </div>
        <audio id="audio-3" preload="none"></audio>
      </div>
    </article>

  </main>
</div>

<script>
  // ── DECRYPTION GATE ──
  // The three recordings are stored AES-GCM encrypted. The key is derived from
  // the answer to "Where are we headed next?" via PBKDF2. A wrong answer yields
  // a wrong key and decryption simply fails, so the audio cannot be recovered
  // from the files on the server without it.
  var SALT = Uint8Array.from(atob('tO6nk9XD2JjdDmDAOKatcQ=='), function(c){ return c.charCodeAt(0); });
  var ITER = 200000;
  var FILES = { 1:'recording-1.enc', 2:'recording-2.enc', 3:'recording-3.enc' };

  var gate   = document.getElementById('gate');
  var journal= document.getElementById('journal');
  var form   = document.getElementById('gate-form');
  var input  = document.getElementById('answer');
  var btn    = document.getElementById('gate-btn');
  var errEl  = document.getElementById('gate-err');

  function normalize(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
  function showErr(m){ errEl.textContent = m; }
  function setBusy(b){ btn.disabled = b; btn.textContent = b ? 'Unsealing...' : 'Unseal'; }

  async function deriveKey(answer){
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(answer), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:SALT, iterations:ITER, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  }

  async function unlock(){
    var answer = normalize(input.value);
    if(!answer){ showErr('Say where.'); return; }
    showErr(''); setBusy(true);
    try{
      var key = await deriveKey(answer);
      var urls = {};
      for(var i=1;i<=3;i++){
        var resp = await fetch(FILES[i]);
        if(!resp.ok) throw new Error('missing');
        var buf = new Uint8Array(await resp.arrayBuffer());
        var iv = buf.slice(0,12), body = buf.slice(12);
        var plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:iv }, key, body);
        urls[i] = URL.createObjectURL(new Blob([plain], { type:'audio/mp4' }));
      }
      for(var j=1;j<=3;j++){ var a=document.getElementById('audio-'+j); a.src=urls[j]; a.preload='metadata'; }
      gate.hidden = true; journal.hidden = false;
      [1,2,3].forEach(initPlayer);
    }catch(e){
      showErr('That is not the way. Try again.');
    }finally{
      setBusy(false);
    }
  }

  form.addEventListener('submit', function(e){ e.preventDefault(); unlock(); });
  input.addEventListener('input', function(){ showErr(''); });
  input.focus();

  // ── PLAYERS (initialised only after a successful unlock) ──
  function initPlayer(i){
    var audio=document.getElementById('audio-'+i);
    if(!audio) return;
    var btn=document.getElementById('btn-'+i);
    var scrub=document.getElementById('scrub-'+i);
    var fill=document.getElementById('fill-'+i);
    var head=document.getElementById('head-'+i);
    var curEl=document.getElementById('cur-'+i);
    var durEl=document.getElementById('dur-'+i);
    var player=document.getElementById('player-'+i);
    var label='Recording '+(i===1?'I':i===2?'II':'III');

    function fmt(s){ if(!isFinite(s))return '0:00'; var m=Math.floor(s/60),sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }
    function setPct(p){ p=Math.max(0,Math.min(100,p)); fill.style.width=p+'%'; head.style.left=p+'%'; scrub.setAttribute('aria-valuenow',Math.round(p)); }

    audio.addEventListener('loadedmetadata',function(){ durEl.textContent=fmt(audio.duration); });
    audio.addEventListener('timeupdate',function(){ if(audio.duration) setPct((audio.currentTime/audio.duration)*100); curEl.textContent=fmt(audio.currentTime); });
    audio.addEventListener('play',function(){
      document.querySelectorAll('audio').forEach(function(a){ if(a!==audio) a.pause(); });
      btn.classList.add('playing'); player.classList.add('active'); btn.setAttribute('aria-label','Pause '+label);
    });
    audio.addEventListener('pause',function(){ btn.classList.remove('playing'); player.classList.remove('active'); btn.setAttribute('aria-label','Play '+label); });
    audio.addEventListener('ended',function(){ setPct(0); curEl.textContent='0:00'; });

    btn.addEventListener('click',function(){ if(audio.paused) audio.play(); else audio.pause(); });

    function seek(clientX){ var rect=scrub.getBoundingClientRect(); var p=(clientX-rect.left)/rect.width; if(audio.duration) audio.currentTime=Math.max(0,Math.min(1,p))*audio.duration; }
    scrub.addEventListener('click',function(e){ seek(e.clientX); });
    var dragging=false;
    scrub.addEventListener('mousedown',function(e){ dragging=true; seek(e.clientX); });
    window.addEventListener('mousemove',function(e){ if(dragging) seek(e.clientX); });
    window.addEventListener('mouseup',function(){ dragging=false; });
    scrub.addEventListener('keydown',function(e){
      if(!audio.duration) return;
      if(e.key==='ArrowRight'){ audio.currentTime=Math.min(audio.duration,audio.currentTime+5); e.preventDefault(); }
      else if(e.key==='ArrowLeft'){ audio.currentTime=Math.max(0,audio.currentTime-5); e.preventDefault(); }
      else if(e.key===' '||e.key==='Enter'){ if(audio.paused) audio.play(); else audio.pause(); e.preventDefault(); }
    });
  }
</script>

</body>
</html>
